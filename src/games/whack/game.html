<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Virus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --hole: #0a0f1e;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .stats {
      display: flex;
      gap: 20px;
    }

    .stat {
      text-align: right;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    #score-val { color: var(--accent); }
    #timer-val { color: var(--warn); }
    #lives-val { color: var(--danger); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 20px;
    }

    /* ── grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 520px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--hole);
      border-radius: 50%;
      border: 3px solid var(--border);
      overflow: hidden;
      position: relative;
      cursor: default;
      transition: border-color 0.15s;
      box-shadow: inset 0 6px 12px rgba(0,0,0,.6);
    }

    .virus-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(110%);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .cell.up .virus-wrap { transform: translateY(0); }

    .cell.up {
      cursor: crosshair;
      border-color: var(--danger);
    }

    .cell.whacked .virus-wrap { transform: translateY(110%); transition: transform 0.1s ease-in; }
    .cell.whacked { border-color: var(--success) !important; }

    .virus {
      font-size: clamp(28px, 8vw, 52px);
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(239,68,68,.6));
      animation: wobble 0.6s ease-in-out infinite alternate;
    }

    @keyframes wobble {
      from { transform: rotate(-5deg) scale(1); }
      to   { transform: rotate(5deg) scale(1.08); }
    }

    .cell.whacked .virus {
      animation: splat 0.25s ease forwards;
    }

    @keyframes splat {
      0%   { transform: scale(1); opacity: 1; }
      50%  { transform: scale(1.5) rotate(20deg); opacity: 0.7; }
      100% { transform: scale(0.2) rotate(-30deg); opacity: 0; }
    }

    /* ── miss flash ── */
    .cell.miss { animation: miss-flash 0.3s ease; }
    @keyframes miss-flash {
      0%,100% { border-color: var(--border); }
      50%     { border-color: var(--danger); background: #1f0a0a; }
    }

    /* ── overlay ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.hidden { display: none; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 40px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }

    .panel-emoji { font-size: 56px; line-height: 1; margin-bottom: 12px; }

    .panel h2 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .panel p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .score-display {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 28px;
    }

    .score-item { text-align: center; }
    .score-item .num { font-size: 32px; font-weight: 800; color: var(--accent); }
    .score-item .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

    button.btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button.btn:hover { opacity: 0.9; transform: scale(1.03); }
    button.btn:active { transform: scale(0.97); }

    /* ── difficulty indicator ── */
    .level-bar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--danger));
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── hit feedback floaters ── */
    .floater {
      position: fixed;
      font-size: 18px;
      font-weight: 800;
      color: var(--success);
      pointer-events: none;
      animation: floatUp 0.8s ease forwards;
      z-index: 200;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Whack-a-<span>Virus</span></h1>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Lives</div>
        <div class="stat-value" id="lives-val">♥♥♥</div>
      </div>
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score-val">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer-val">60</div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="level-bar">
      <span id="level-label">Level 1</span>
      <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
      <span id="level-max">10</span>
    </div>
  </main>

  <!-- Start overlay -->
  <div class="overlay" id="start-overlay">
    <div class="panel">
      <div class="panel-emoji">🦠</div>
      <h2>Whack-a-Virus</h2>
      <p>Viruses are spreading! Click them before they hide.<br>Miss one? You lose a life. Survive 60 seconds.</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div class="overlay hidden" id="over-overlay">
    <div class="panel">
      <div class="panel-emoji" id="over-emoji">😷</div>
      <h2 id="over-title">Game Over</h2>
      <p id="over-msg">The viruses won this round.</p>
      <div class="score-display">
        <div class="score-item">
          <div class="num" id="final-score">0</div>
          <div class="lbl">Score</div>
        </div>
        <div class="score-item">
          <div class="num" id="final-best">0</div>
          <div class="lbl">Best</div>
        </div>
      </div>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const COLS = 4, ROWS = 4, TOTAL = COLS * ROWS;
    const GAME_DURATION = 60;
    const VIRUSES = ['🦠', '🧫', '🔬'];
    const MISS_PENALTY = 1; // lives lost per missed virus

    // difficulty ramp: [score threshold, upInterval ms, downInterval ms]
    const LEVELS = [
      { threshold: 0,  up: 1200, down: 1400 },
      { threshold: 5,  up: 1050, down: 1250 },
      { threshold: 10, up: 900,  down: 1100 },
      { threshold: 18, up: 750,  down: 950  },
      { threshold: 28, up: 620,  down: 800  },
      { threshold: 40, up: 500,  down: 680  },
      { threshold: 55, up: 400,  down: 560  },
      { threshold: 75, up: 320,  down: 440  },
    ];

    let score = 0, lives = 3, timeLeft = GAME_DURATION, running = false;
    let bestScore = +(localStorage.getItem('wav_best') || 0);
    let mainInterval = null, timerInterval = null;
    let activeTimers = [];
    let currentLevel = 0;

    const grid = document.getElementById('grid');
    const scoreEl = document.getElementById('score-val');
    const timerEl = document.getElementById('timer-val');
    const livesEl = document.getElementById('lives-val');
    const barFill = document.getElementById('bar-fill');
    const levelLabel = document.getElementById('level-label');
    const levelMax = document.getElementById('level-max');

    // Build grid
    for (let i = 0; i < TOTAL; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.idx = i;
      const wrap = document.createElement('div');
      wrap.className = 'virus-wrap';
      const v = document.createElement('span');
      v.className = 'virus';
      wrap.appendChild(v);
      cell.appendChild(wrap);
      grid.appendChild(cell);
    }

    const cells = [...grid.querySelectorAll('.cell')];

    function getLevelConfig() {
      let cfg = LEVELS[0];
      for (const l of LEVELS) {
        if (score >= l.threshold) cfg = l;
      }
      return cfg;
    }

    function updateLevelDisplay() {
      const idx = LEVELS.findIndex(l => l === getLevelConfig());
      const next = LEVELS[idx + 1];
      currentLevel = idx + 1;
      levelLabel.textContent = `Level ${currentLevel}`;
      if (next) {
        levelMax.textContent = next.threshold;
        const pct = ((score - getLevelConfig().threshold) / (next.threshold - getLevelConfig().threshold)) * 100;
        barFill.style.width = Math.min(pct, 100) + '%';
      } else {
        levelMax.textContent = '∞';
        barFill.style.width = '100%';
      }
    }

    function renderLives() {
      livesEl.textContent = '♥'.repeat(Math.max(lives, 0)) + '♡'.repeat(Math.max(3 - lives, 0));
      if (lives <= 1) livesEl.style.color = '#ef4444';
      else if (lives === 2) livesEl.style.color = '#f59e0b';
      else livesEl.style.color = '#ef4444';
    }

    function popVirus() {
      if (!running) return;
      const available = cells.filter(c => !c.classList.contains('up') && !c.classList.contains('whacked'));
      if (available.length === 0) return;

      const cell = available[Math.floor(Math.random() * available.length)];
      const vEmoji = VIRUSES[Math.floor(Math.random() * VIRUSES.length)];
      cell.querySelector('.virus').textContent = vEmoji;
      cell.classList.add('up');

      const cfg = getLevelConfig();
      const hideDelay = cfg.down + Math.random() * 200 - 100;

      const tid = setTimeout(() => {
        if (!cell.classList.contains('whacked') && cell.classList.contains('up')) {
          // missed
          cell.classList.remove('up');
          if (running) {
            lives = Math.max(0, lives - MISS_PENALTY);
            renderLives();
            if (lives === 0) endGame(false);
          }
        }
      }, hideDelay);
      activeTimers.push(tid);
    }

    function scheduleNext() {
      if (!running) return;
      const cfg = getLevelConfig();
      const delay = cfg.up + Math.random() * 300 - 150;
      const tid = setTimeout(() => {
        popVirus();
        scheduleNext();
      }, delay);
      activeTimers.push(tid);
    }

    cells.forEach(cell => {
      cell.addEventListener('click', (e) => {
        if (!running) return;
        if (cell.classList.contains('up') && !cell.classList.contains('whacked')) {
          cell.classList.remove('up');
          cell.classList.add('whacked');
          score++;
          scoreEl.textContent = score;
          updateLevelDisplay();
          spawnFloater(e.clientX, e.clientY, `+1`);

          setTimeout(() => cell.classList.remove('whacked'), 350);
        } else if (!cell.classList.contains('up')) {
          cell.classList.add('miss');
          setTimeout(() => cell.classList.remove('miss'), 300);
        }
      });
    });

    function spawnFloater(x, y, text) {
      const f = document.createElement('div');
      f.className = 'floater';
      f.textContent = text;
      f.style.left = (x - 12) + 'px';
      f.style.top = (y - 12) + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 800);
    }

    function startGame() {
      score = 0; lives = 3; timeLeft = GAME_DURATION;
      running = true;
      scoreEl.textContent = '0';
      timerEl.textContent = GAME_DURATION;
      renderLives();
      updateLevelDisplay();

      cells.forEach(c => c.classList.remove('up', 'whacked', 'miss'));
      activeTimers.forEach(clearTimeout);
      activeTimers = [];

      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('over-overlay').classList.add('hidden');

      // kick off viruses with staggered start
      for (let i = 0; i < 2; i++) {
        const tid = setTimeout(() => { popVirus(); }, i * 300);
        activeTimers.push(tid);
      }
      scheduleNext();

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 10) timerEl.style.color = '#ef4444';
        else if (timeLeft <= 20) timerEl.style.color = '#f59e0b';
        else timerEl.style.color = '#f59e0b';
        if (timeLeft <= 0) endGame(true);
      }, 1000);
    }

    function endGame(survived) {
      running = false;
      activeTimers.forEach(clearTimeout);
      activeTimers = [];
      clearInterval(timerInterval);
      cells.forEach(c => c.classList.remove('up', 'whacked'));

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('wav_best', bestScore);
      }

      document.getElementById('final-score').textContent = score;
      document.getElementById('final-best').textContent = bestScore;

      if (survived) {
        document.getElementById('over-emoji').textContent = '🏆';
        document.getElementById('over-title').textContent = 'You Survived!';
        document.getElementById('over-msg').textContent = `You whacked ${score} viruses. The world is safe… for now.`;
      } else {
        document.getElementById('over-emoji').textContent = '😷';
        document.getElementById('over-title').textContent = 'Infected!';
        document.getElementById('over-msg').textContent = `The viruses overwhelmed you. You whacked ${score} before going down.`;
      }

      document.getElementById('over-overlay').classList.remove('hidden');
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
  </script>
</body>
</html>
