<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #e8f7ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .page-header { flex-shrink: 0; }
  .controls { flex-shrink: 0; }
  .svg-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .rotor { transform-origin: 0px 0px; animation: spin 8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── HEADER ── */
  .page-header {
    background: #fff;
    padding: 22px 32px 18px;
    text-align: center;
  }
  .page-title {
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 900;
    color: #1a6ea8;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .page-subtitle {
    margin-top: 6px;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 500;
    color: #6aaccc;
    font-style: italic;
  }

  /* ── CONTROLS ── */
  .controls {
    background: #fff;
    padding: 18px 32px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .slider-emoji {
    font-size: 2.2rem;
    line-height: 1;
    flex-shrink: 0;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: min(480px, 70vw);
    height: 20px;
    border-radius: 999px;
    background: linear-gradient(to right, #5bc8f5 0%, #5bc8f5 var(--pct, 40%), #c8ecfa var(--pct, 40%), #c8ecfa 100%);
    outline: none;
    cursor: pointer;
    border: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #2d6fa4;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    cursor: grab;
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
  input[type=range]::-moz-range-thumb {
    width: 42px; height: 42px; border-radius: 50%;
    background: #fff; border: 4px solid #2d6fa4;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18); cursor: grab;
  }
</style>
</head>

<!-- ── CONTROLS ── -->
<div class="controls">
  <span class="slider-emoji">🐢</span>
  <input type="range" id="speedSlider" min="1" max="100" value="40"/>
  <span class="slider-emoji">🐇</span>
</div>

<script>
  const slider = document.getElementById('speedSlider');
  const rotors = Array.from(document.querySelectorAll('.rotor'));
  const randMults = [1.0, 0.82, 1.18, 0.91, 1.35, 0.74, 1.07, 1.22, 0.88];

  function sliderToDuration(val) {
    return 40 - (val - 1) * (39 / 99);
  }

  function updateSliderTrack(val) {
    const pct = ((val - 1) / 99 * 100).toFixed(1) + '%';
    slider.style.setProperty('--pct', pct);
  }

  function applyAnimations() {
    const baseDur = sliderToDuration(+slider.value);
    rotors.forEach((rotor, i) => {
      rotor.style.animationDuration = (baseDur * randMults[i]).toFixed(2) + 's';
    });
  }

  slider.addEventListener('input', () => {
    updateSliderTrack(+slider.value);
    applyAnimations();
  });

  // Number keys 1–9 = 10%–90%, 0 = 100% — animate the slider thumb smoothly
  function animateSliderTo(target) {
    const start = +slider.value;
    const duration = 400; // ms
    const startTime = performance.now();
    function step(now) {
      const t = Math.min((now - startTime) / duration, 1);
      // ease-out cubic
      const ease = 1 - Math.pow(1 - t, 3);
      const current = Math.round(start + (target - start) * ease);
      slider.value = current;
      updateSliderTrack(current);
      applyAnimations();
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  document.addEventListener('keydown', (e) => {
    const map = {'1':10,'2':20,'3':30,'4':40,'5':50,'6':60,'7':70,'8':80,'9':90,'0':100};
    if (e.key in map) animateSliderTo(map[e.key]);
  });

  updateSliderTrack(+slider.value);
  applyAnimations();
</script>
